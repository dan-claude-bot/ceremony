# Path → scope:* mapping for the labels workflow's scope job
# (actions/labels-scope since #130: it reads this mapping at the BASE ref
# and its only write is an additive POST, so a label applied while the job
# runs survives the machine — its predecessor, actions/labeler@v5, PUT the
# whole set and clobbered ceremony#128's `release` mid-job). The scope
# taxonomy itself lives in .github/labels.conf; LABELS.md carries the table
# these globs implement. Scopes locate, they do not alert — a path that maps
# to nothing is fine (the mapping is advisory), so these rows chase the big
# surfaces, not every file.
#
# A row that matches everything is worse than a missing one: it costs the
# same silence and adds a wrong answer. `changelog.d/**` sat under
# scope:release-flow until #267 measured it — the last 20 PRs (#197–#263)
# all carried scope:release-flow and 3 of them touched a release surface,
# because BUILDER.md makes every behavior change write a fragment, so the
# glob was "any PR that changes behavior" by doctrine. CHANGELOG.md stays:
# the same doctrine forbids editing it for an entry, so only the release PR
# does. The other rows #267 added — the issueflow reconciler, the three
# unmapped guard actions, RELEASES.md, README (which this tree spells
# README.md, so the old glob could match nothing) — are the same read of the
# same file, gaps rather than wrong answers.
#
# #302 is the same read once more, from #300's review: lib/attention.sh had
# #267 D4's premise exactly (both reconcilers source it, nothing release-side
# does) and was not in the rows — a wrong answer, not a gap. The sweep
# workflow pair joins beside its trigger pair: the sweeps detached in #209
# and took the reconcile jobs and the cron with them. Two asymmetries are
# deliberate, not drift: the TESTS of the four shared files lib/read.sh,
# lib/ruling.sh, lib/attention.sh and lib/checks.sh take scope:labels alone,
# because those subjects wear scope:release-flow only through the lib/** glob
# being kept whole and a test file inherits no such glob; there is still no
# test/** or .github/scripts/** catch-all, because both directories span all
# four scopes — a catch-all is the changelog.d/** defect again, 100% recall
# and no locating power; and files in those two directories that locate no
# one scope are declared below rather than left indistinguishable from an
# omission. The enumeration is the price of a test locating its subject.
#
# scope-unmapped: begin
# scope-unmapped: test/harness.sh | assertion plumbing shared by every test surface
# scope-unmapped: test/run.sh | suite runner spanning every test surface
# scope-unmapped: .github/scripts/shellcheck-all.sh | lint driver spanning the whole tree
# scope-unmapped: .github/scripts/actionlint-all.sh | lint driver spanning every workflow surface
# scope-unmapped: end
scope:release-flow:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/release.yml
          - .github/workflows/self-release.yml
          - .github/workflows/release-exercise.yml
          - .github/scripts/self-ref-check.sh
          - lib/**
          - bin/**
          - VERSION
          - CHANGELOG.md
          - drills/**
          - test/decide.test.sh
          - test/facts.test.sh
          - test/labeled.test.sh
          - test/release-chain.test.sh
          - test/release-dispatch.test.sh
          - test/version.test.sh
          - test/changelog.test.sh
          - test/self-ref.test.sh
          - test/changelog-assemble.test.sh
          - test/tag-classify.test.sh
          - test/track.test.sh
          # one test genuinely locates three subjects: the labels reusables,
          # release reusable and consumer-doc contract (#518 D3)
          - test/runner-input.test.sh
          - .github/scripts/release-path.sh
          - test/release-path.test.sh
          # the drill instrument and its guard (#484 D10). `drills/**` — the
          # record — was here from the start while `drill/` — what writes it —
          # was named nowhere, so the instrument, its libs, its suite and the
          # round-trip guard all mapped to no scope: a wrong answer of the kind
          # #476 is the standing precedent for, not a gap. All three are
          # release-path evidence machinery. The two test/ rows are enumerated
          # rather than folded into a test/** catch-all, for the reason the
          # comment block above gives: test/ spans all four scopes, so a
          # catch-all is the changelog.d/** defect again.
          - drill/**
          - test/drill-rehearsal.test.sh
          - .github/scripts/record-roundtrip.sh
          # the consumer pin-mover's suite. A row, not a scope-unmapped
          # declaration: its subject is bin/ceremony-upgrade alone, which
          # `bin/**` above already maps here, so the test locates exactly the
          # one scope its subject does (#302 D3). It drives actions/docs-sync
          # as a collaborator and asserts nothing about it, so it is not the
          # mixed case that honestly wears two labels (#561 G10)
          - test/ceremony-upgrade.test.sh
scope:guards:
  - changed-files:
      - any-glob-to-any-file:
          - actions/changelog-armed/**
          - actions/changelog-assembled/**
          - actions/changelog-monotonic/**
          - actions/docs-sync/**
          - actions/drill-recorded/**
          - actions/refs-not-closing/**
          - actions/runner-isolated/**
          - actions/sha-pinned/**
          - .github/workflows/refs-guard.yml
          - test/changelog-armed.test.sh
          - test/changelog-assembled.test.sh
          - test/changelog-monotonic.test.sh
          - test/docs-sync.test.sh
          - test/drill-recorded.test.sh
          - test/refs-not-closing.test.sh
          - test/runner-isolated.test.sh
          - test/sha-pinned.test.sh
          - .github/scripts/marker-check.sh
          - test/marker-check.test.sh
          - .github/scripts/vendored-check.sh
          - test/vendored.test.sh
scope:labels:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/labels.yml
          - .github/workflows/self-labels.yml
          - .github/workflows/labels-sweep.yml
          - .github/workflows/self-labels-sweep.yml
          - .github/labeler.yml
          - .github/labels.conf
          - actions/issueflow-reconcile/**
          - actions/labels-reconcile/**
          - actions/labels-scope/**
          # the rerun servicing (#424): labels, not guards. That block is the
          # family of actions that GRADE a PR and can fail it, each with a
          # test/<guard>.test.sh beside it; this one grades nothing — it is
          # triggered by a label, clears a label, and services the same board
          # machinery as the two reconcilers above.
          - actions/ci-rerun/**
          - .github/workflows/ci-rerun.yml
          - .github/workflows/self-ci-rerun.yml
          - test/ci-rerun.test.sh
          # shared by both reconcilers; lib/** keeps scope:release-flow too,
          # and a mixed file honestly wears both labels (#267 D4, #302 D1)
          - lib/read.sh
          - lib/ruling.sh
          - lib/attention.sh
          - lib/checks.sh
          - LABELS.md
          - test/issueflow-reconcile.test.sh
          - test/labels.test.sh
          - test/labels-reconcile.test.sh
          - test/labels-scope.test.sh
          # one test genuinely locates three subjects: the labels reusables,
          # release reusable and consumer-doc contract (#518 D3)
          - test/runner-input.test.sh
          # tests of the shared lib/ files: scope:labels ALONE — a test
          # inherits no lib/** glob, so its row is the one scope its subject
          # actually locates (#302 D3)
          - test/attention.test.sh
          - test/ruling.test.sh
          - test/checks.test.sh
          - test/labels-triggers.test.sh
scope:docs:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - docs/**
          - AGENTS.md
          - BUILDER.md
          - FLEET.md
          - RELEASES.md
          - REVIEWER.md
          - TRIAGE.md
          - CONTRIBUTING.md
          - test/doctrine-request.test.sh
          # one test genuinely locates three subjects: the labels reusables,
          # release reusable and consumer-doc contract (#518 D3)
          - test/runner-input.test.sh
