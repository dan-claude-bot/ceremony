name: release exercise
# The scratch caller (issue #9's acceptance criterion): dry wiring only —
# nothing is ever tagged, published, or bumped. Three jobs, three claims:
#
#   * `call` — a workflow_call `uses:` validates and parses the called file
#     when the run starts, so a green run proves release.yml parses and its
#     input contract wires. Both jobs inside it are gated on the push event
#     (rig's form), so a non-push caller — dispatch here, pull_request via
#     ci.yml — skips them by design.
#   * `step-replay` — the merge door's early step sequence executed for
#     real (round 1's blocking catch: `call` proves the parse but runs
#     zero steps): the two-checkout dance including the `path:
#     .ceremony-src` checkout, both branches of the self-consumption
#     bypass, the CEREMONY_DIR / RELEASE_ASSETS_DIR wiring, then facts →
#     decide → notes through the real $GITHUB_OUTPUT step plumbing — all
#     against a constructed fixture tree with a stubbed gh, so a wrong
#     `path:`, an inverted bypass, or a CEREMONY_DIR pointing nowhere fails
#     HERE, not in a consumer's release. The steps are release.yml's own,
#     copied 1:1 where the context allows; where it cannot, the deviation
#     is commented at the step.
#   * `fixture-chain` — the same script chain offline, via the contract
#     test CI runs on every PR (test/release-chain.test.sh).
#
# Runs on workflow_dispatch, and on every PR via ci.yml's workflow_call
# (PR-only there, on purpose — see ci.yml's gate comment). The live doors
# remain the stated honest gap, closed by #11 (ceremony's own 0.1.0
# release calls this exact workflow by local path) and the #13 pilot's
# rehearsal.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  call:
    # Dry: version-source exercises the input contract; the doors stay shut
    # on a non-push event. The real caller stub — triggers, permissions,
    # the pinned ref — lives in release.yml's header and docs/CONSUMERS.md.
    uses: ./.github/workflows/release.yml
    with:
      version-source: file

  call-track:
    # The same dry parse with a release track's inputs (#618): a green run
    # proves `path` and `tag-prefix` are part of the input contract.
    uses: ./.github/workflows/release.yml
    with:
      version-source: file
      path: apps/admin
      tag-prefix: admin-
      non-release-namespace: "[0-9]*"

  step-replay:
    runs-on: ubuntu-latest
    env:
      # release.yml selects inputs.merged-sha or github.sha. This scratch
      # caller deliberately passes no merged-sha, so its selected head is the
      # run head and the copied early steps exercise that dry shape.
      MERGE_SHA: ${{ github.sha }}
      # release.yml's workflow-level env from its two track inputs (#618),
      # at their defaults: the replay's fixture is the default track.
      TRACK_PATH: "."
      TAG_PREFIX: ""
    strategy:
      matrix:
        # release.yml keys its bypass on `github.repository ==
        # 'heavy-duty/ceremony'`; the matrix stands in for that condition so
        # BOTH branches run from this one repo — the dogfood repo can never
        # take the consumer branch for real, and vice versa.
        shape: [dogfood, consumer]
    steps:
      - name: assert a dispatched head is a full lowercase commit SHA
        # release.yml gates this copied step on a non-empty merged-sha. The
        # replay supplies its selected run head so the same body executes.
        env:
          MERGED_SHA: ${{ env.MERGE_SHA }}
        run: |
          case "$MERGED_SHA" in
            *[!0-9a-f]*|'') invalid=true ;;
            ????????????????????????????????????????) invalid=false ;;
            *) invalid=true ;;
          esac
          if [ "$invalid" = true ]; then
            echo "merged-sha must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # release.yml's first checkout, verbatim: the selected head and its
          # first parent.
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # release.yml's second checkout — the consumer path's pinned
        # ceremony source, same `path:` wiring. One forced deviation: the
        # ref is github.sha, not CEREMONY_SELF_REF — the pinned tag cannot
        # exist before the first release (the exact deadlock the bypass
        # solves), and the pin's VALUE is already guarded by
        # .github/scripts/self-ref-check.sh in CI. What this step proves is
        # the wiring: the checkout lands in .ceremony-src and every later
        # step resolves libs through it.
        if: matrix.shape == 'consumer'
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ceremony-src
      - name: wire CEREMONY_DIR and the assets dir
        env:
          SHAPE: ${{ matrix.shape }}
        # release.yml's wiring step with the matrix standing in for the
        # GITHUB_REPOSITORY test (comment on the matrix above).
        run: |
          if [ "$SHAPE" = "dogfood" ]; then
            echo "CEREMONY_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "CEREMONY_DIR=$GITHUB_WORKSPACE/.ceremony-src" >> "$GITHUB_ENV"
          fi
          mkdir -p "$RUNNER_TEMP/release-assets"
          echo "RELEASE_ASSETS_DIR=$RUNNER_TEMP/release-assets" >> "$GITHUB_ENV"
      - name: resolve the release track — its directory and tag prefix
        # release.yml's step verbatim (#618).
        run: |
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/track.sh"
          track="$(track_path_normalize "$TRACK_PATH")"
          track_prefix_check "$TAG_PREFIX"
          echo "TRACK_PATH=$track" >> "$GITHUB_ENV"
          echo "release track: path '$track', tag prefix '$TAG_PREFIX'"
      - name: construct the fixture consumer tree and the gh stub
        # The fixture release.yml's steps run against (below): a base at
        # 0.6.9-dev armed the fragment way (#112) — changelog.d/ with its
        # marker and one fragment — then the ceremony merge: VERSION bumped
        # bare and the section stamped by the REAL assembler, the command
        # the real ceremony PR runs by hand (#112 D12), so the exercise
        # consumes the tool end to end instead of hand-writing its output.
        # Same shape as test/release-chain.test.sh. The gh stub answers the
        # one API fact the ceremony path consults (the merged
        # release-labeled PR), as the association API answers it — a JSON
        # array that lib/labeled.sh reads (#628) — so nothing here talks to
        # GitHub.
        run: |
          mkdir -p "$RUNNER_TEMP/stub"
          cat > "$RUNNER_TEMP/stub/gh" <<'EOF'
          #!/usr/bin/env bash
          if [ "$1" = api ]; then echo '[{"number":1,"merged_at":"2026-01-01T00:00:00Z","labels":[{"name":"release"}]}]'; exit 0; fi
          if [ "$1" = release ] && [ "$2" = create ]; then
            tag="$3"
            shift 3
            prerelease=false
            notes_file=""
            while [ "$#" -gt 0 ]; do
              case "$1" in
                --prerelease) prerelease=true; shift ;;
                --notes-file) notes_file="$2"; shift 2 ;;
                --title | -R) shift 2 ;;
                --verify-tag) shift ;;
                *) shift ;;
              esac
            done
            [ -n "$notes_file" ] && [ -f "$notes_file" ] || exit 98
            mkdir -p "$EXERCISE_RELEASES"
            printf 'isPrerelease=%s\n' "$prerelease" > "$EXERCISE_RELEASES/$tag.meta"
            cp "$notes_file" "$EXERCISE_RELEASES/$tag.notes"
            exit 0
          fi
          echo "gh stub: unexpected call: gh $*" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/stub/gh"
          echo "$RUNNER_TEMP/stub" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/releases"
          echo "EXERCISE_RELEASES=$RUNNER_TEMP/releases" >> "$GITHUB_ENV"
          git init -q "$RUNNER_TEMP/fixture"
          cd "$RUNNER_TEMP/fixture"
          git config user.email fixture@example.invalid
          git config user.name fixture
          printf '0.6.9-dev\n' > VERSION
          cat > CHANGELOG.md <<'EOF'
          # Changelog

          ## 0.6.8 — 2026-07-01

          - An older entry.
          EOF
          mkdir changelog.d
          printf '# changelog.d/ — assembled at release (heavy-duty/ceremony#112); the marker keeps the directory tracked.\n' > changelog.d/README.md
          printf -- '- The entry this release ships (#42).\n' > changelog.d/42.md
          git add VERSION CHANGELOG.md changelog.d
          git commit -qm "base"
          printf '0.7.0\n' > VERSION
          bash "$CEREMONY_DIR/bin/changelog-assemble" 0.7.0 2026-07-21
          git add -A
          git commit -qm "release: 0.7.0"
          echo "FIXTURE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: gather the facts — version, base version, released, labeled
        id: facts
        working-directory: ${{ runner.temp }}/fixture
        env:
          MERGE_SHA: ${{ env.FIXTURE_SHA }}
          # Empty exercises the branch-create fallback: facts.sh must fall
          # back to the merge commit's first parent (#1 constraint 10).
          EVENT_BEFORE: ""
          VERSION_SOURCE: file
        # release.yml's step verbatim — same invocation, same
        # $GITHUB_OUTPUT plumbing — cwd'd at the fixture instead of the
        # workspace (the one thing a replay cannot inherit).
        run: bash "$CEREMONY_DIR/lib/facts.sh" >> "$GITHUB_OUTPUT"
      - name: 'decide: ceremony, or release-flow work under the label?'
        id: decide
        env:
          VER: ${{ steps.facts.outputs.ver }}
          BASE_VER: ${{ steps.facts.outputs.base_ver }}
          RELEASED: ${{ steps.facts.outputs.released }}
          LABELED: ${{ steps.facts.outputs.labeled }}
        # release.yml's step verbatim.
        run: |
          out="$(bash "$CEREMONY_DIR/lib/decide.sh")"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep '^ceremony=' >> "$GITHUB_OUTPUT"
      - name: release notes — final section or rc fragments
        if: steps.decide.outputs.ceremony == 'yes'
        working-directory: ${{ runner.temp }}/fixture
        env:
          VER: ${{ steps.facts.outputs.ver }}
        # release.yml's step verbatim, cwd'd at the fixture.
        run: |
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/changelog.sh"
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/version.sh"
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/track.sh"
          changelog="$(track_file "$TRACK_PATH" CHANGELOG.md)"
          if version_is_rc "$VER"; then
            bash "$CEREMONY_DIR/bin/changelog-assemble" "$VER" --check \
              --changelog "$changelog" --dir "$(track_file "$TRACK_PATH" changelog.d)" > "$RUNNER_TEMP/notes.md"
          else
            if ! diagnosis="$(changelog_section_problem "$changelog" "$VER")"; then
              echo "$changelog has no '## $VER' section at the merge commit — the ceremony PR must stamp it; refusing to publish an empty release" >&2
              printf '%s\n' "$diagnosis" >&2
              exit 1
            fi
            changelog_section "$changelog" "$VER" > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: an entry-less stamped fixture is refused by the notes predicate
        working-directory: ${{ runner.temp }}/fixture
        env:
          VER: ${{ steps.facts.outputs.ver }}
        run: |
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.good.md"
          awk -v ver="$VER" '
            /^## / { in_section = ($2 == ver) }
            in_section && /^[[:space:]]*[-*][[:space:]]/ { next }
            { print }
          ' "$RUNNER_TEMP/CHANGELOG.good.md" > CHANGELOG.md
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/changelog.sh"
          if diagnosis="$(changelog_section_problem CHANGELOG.md "$VER")"; then
            echo "entry-less stamped section unexpectedly passed" >&2
            exit 1
          fi
          printf '%s\n' "$diagnosis" | grep -F "section '$VER' has no entries"
          cp "$RUNNER_TEMP/CHANGELOG.good.md" CHANGELOG.md
      - name: the chain must land where the fixture says it lands
        env:
          CEREMONY: ${{ steps.decide.outputs.ceremony }}
          VER: ${{ steps.facts.outputs.ver }}
          BASE_VER: ${{ steps.facts.outputs.base_ver }}
        # Not a release.yml step — the replay's own assertion that the real
        # steps produced the facts and verdict the fixture encodes, so a
        # green job means the wiring carried real values, not empties.
        run: |
          [ "$VER" = "0.7.0" ] || { echo "ver: got '$VER'" >&2; exit 1; }
          [ "$BASE_VER" = "0.6.9-dev" ] || { echo "base_ver: got '$BASE_VER'" >&2; exit 1; }
          [ "$CEREMONY" = "yes" ] || { echo "ceremony: got '$CEREMONY'" >&2; exit 1; }
          grep -q "The entry this release ships" "$RUNNER_TEMP/notes.md" \
            || { echo "notes.md missing the fixture's entry" >&2; exit 1; }
          echo "step-replay ($CEREMONY_DIR): facts -> decide -> notes carried real values end to end"

      - name: rc merge and tag doors, then final promotion — replayed end to end
        # The fixture executes the notes and publish branches from both live
        # doors, then the merge door's re-arm arithmetic. The gh stub above
        # persists release facts and bodies; local tags are the matching dry
        # substitute for the write API. Final promotion follows the rc in the
        # same fixture so the surviving fragments are proved cumulative.
        run: |
          make_rc_fixture() {
            fixture="$1"
            version="$2"
            git init -q "$fixture"
            git -C "$fixture" config user.email fixture@example.invalid
            git -C "$fixture" config user.name fixture
            printf '%s\n' "$version" > "$fixture/VERSION"
            cat > "$fixture/CHANGELOG.md" <<'EOF'
          # Changelog

          ## 0.6.2 — 2026-08-08

          - An older final release.
          EOF
            mkdir "$fixture/changelog.d"
            printf '# fixture marker\n' > "$fixture/changelog.d/README.md"
            printf 'grouped\n' > "$fixture/changelog.d/shape"
            cat > "$fixture/changelog.d/42.md" <<'EOF'
          ### Added

          - The candidate entry survives until promotion (#42).
          EOF
            git -C "$fixture" add VERSION CHANGELOG.md changelog.d
            git -C "$fixture" commit -qm "candidate $version"
          }

          publish_fixture() {
            # release.yml's publish body, with assets empty in this fixture.
            # TAG is the facts step's output there; the default track's tag
            # is the bare version (#618).
            TAG="$VER"
            # shellcheck source=/dev/null
            . "$CEREMONY_DIR/lib/version.sh"
            release_flags=()
            if version_is_rc "$VER"; then
              release_flags+=(--prerelease)
            fi
            assets=()
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" -R "$GITHUB_REPOSITORY" \
              "${release_flags[@]}" \
              "${assets[@]}"
          }

          rc_fixture="$RUNNER_TEMP/rc-fixture"
          make_rc_fixture "$rc_fixture" 0.7.0-rc1
          cd "$rc_fixture"
          before_changelog="$(sha256sum CHANGELOG.md | awk '{ print $1 }')"
          expected_notes="$(bash "$CEREMONY_DIR/bin/changelog-assemble" 0.7.0-rc1 --check)"
          before_tags="$(git tag | wc -l)"
          before_releases="$(find "$EXERCISE_RELEASES" -type f | wc -l)"

          mv changelog.d/42.md "$RUNNER_TEMP/42.md"
          if bash "$CEREMONY_DIR/bin/changelog-assemble" 0.7.0-rc1 --check > "$RUNNER_TEMP/empty-notes.md" 2>&1; then
            echo "zero-fragment rc unexpectedly reached publication" >&2
            exit 1
          fi
          grep -F "zero fragments" "$RUNNER_TEMP/empty-notes.md"
          [ "$(git tag | wc -l)" = "$before_tags" ]
          [ "$(find "$EXERCISE_RELEASES" -type f | wc -l)" = "$before_releases" ]
          mv "$RUNNER_TEMP/42.md" changelog.d/42.md

          VER=0.7.0-rc1
          # release.yml's rc notes branch.
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/changelog.sh"
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/version.sh"
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/track.sh"
          changelog="$(track_file "$TRACK_PATH" CHANGELOG.md)"
          if version_is_rc "$VER"; then
            bash "$CEREMONY_DIR/bin/changelog-assemble" "$VER" --check \
              --changelog "$changelog" --dir "$(track_file "$TRACK_PATH" changelog.d)" > "$RUNNER_TEMP/notes.md"
          else
            changelog_section "$changelog" "$VER" > "$RUNNER_TEMP/notes.md"
          fi
          git tag "$VER"
          publish_fixture
          printf '%s\n' "$expected_notes" | diff -u - "$RUNNER_TEMP/notes.md"
          grep -Fx 'isPrerelease=true' "$EXERCISE_RELEASES/$VER.meta"
          diff -u "$RUNNER_TEMP/notes.md" "$EXERCISE_RELEASES/$VER.notes"
          [ "$(sha256sum CHANGELOG.md | awk '{ print $1 }')" = "$before_changelog" ]
          git cat-file -e "$VER:changelog.d/42.md"
          next="$(version_next_dev "$VER")"
          [ "$next" = 0.7.0-rc2-dev ]
          version_write file "$next"
          [ "$(cat VERSION)" = 0.7.0-rc2-dev ]
          git add VERSION
          git commit -qm "re-arm after $VER"

          # Promotion follows the rc: the final ceremony consumes the same
          # fragments, uses the stamped-section notes path, and bare-bumps.
          VER=0.7.0
          printf '%s\n' "$VER" > VERSION
          bash "$CEREMONY_DIR/bin/changelog-assemble" "$VER" 2026-08-09
          git add VERSION CHANGELOG.md changelog.d
          git commit -qm "promote $VER"
          changelog_section CHANGELOG.md "$VER" > "$RUNNER_TEMP/notes.md"
          git tag "$VER"
          publish_fixture
          grep -Fx 'isPrerelease=false' "$EXERCISE_RELEASES/$VER.meta"
          grep -F 'The candidate entry survives until promotion' "$EXERCISE_RELEASES/$VER.notes"
          next="$(version_next_dev "$VER")"
          [ "$next" = 0.7.1-dev ]
          version_write file "$next"
          [ "$(cat VERSION)" = 0.7.1-dev ]

          # The tag door takes the same rc notes/flag branch and never calls
          # the bump: VERSION remains byte-identical after publication.
          tag_fixture="$RUNNER_TEMP/rc-tag-fixture"
          make_rc_fixture "$tag_fixture" 0.8.0-rc2
          cd "$tag_fixture"
          VER=0.8.0-rc2
          before_version="$(cat VERSION)"
          expected_notes="$(bash "$CEREMONY_DIR/bin/changelog-assemble" "$VER" --check)"
          bash "$CEREMONY_DIR/bin/changelog-assemble" "$VER" --check > "$RUNNER_TEMP/notes.md"
          git tag "$VER"
          publish_fixture
          grep -Fx 'isPrerelease=true' "$EXERCISE_RELEASES/$VER.meta"
          printf '%s\n' "$expected_notes" | diff -u - "$EXERCISE_RELEASES/$VER.notes"
          [ "$(cat VERSION)" = "$before_version" ]
          echo "rc replay ($CEREMONY_DIR): merge/tag prereleases and final promotion carried real release facts"

      - name: two release tracks in one repository — merge door, re-arm, tag doors (#618)
        # One merge that releases the admin track under apps/admin while the
        # default track at the root is ordinary work: facts and decide per
        # track, then release.yml's notes, publish and re-arm bodies with the
        # track's environment (the fetch and push left out, as above), then
        # both tag doors' classification. The gh stub above records the
        # release; the fixture proves only apps/admin/VERSION moved.
        run: |
          fixture="$RUNNER_TEMP/tracks-fixture"
          git init -q "$fixture"
          cd "$fixture"
          git config user.email fixture@example.invalid
          git config user.name fixture
          # The default track at the root, armed with a pending fragment, and
          # an admin track under apps/admin with its own version line.
          printf '1.6.0-dev\n' > VERSION
          printf '# Changelog\n\n## 1.5.10 — 2026-09-24\n\n- The site shipped.\n' > CHANGELOG.md
          mkdir changelog.d
          printf '# fixture marker\n' > changelog.d/README.md
          printf -- '- A site change still pending (#7).\n' > changelog.d/7.md
          mkdir -p apps/admin/changelog.d
          printf '2.0.1-dev\n' > apps/admin/VERSION
          printf '# Changelog\n\n## 2.0.0 — 2026-09-01\n\n- The admin shipped.\n' > apps/admin/CHANGELOG.md
          printf '# fixture marker\n' > apps/admin/changelog.d/README.md
          printf -- '- The admin fixed a thing (#31).\n' > apps/admin/changelog.d/31.md
          git add -A
          git commit -qm base
          base="$(git rev-parse HEAD)"
          # The admin track's ceremony PR, run from the root with its paths.
          printf '2.0.1\n' > apps/admin/VERSION
          bash "$CEREMONY_DIR/bin/changelog-assemble" 2.0.1 2026-09-24 \
            --changelog apps/admin/CHANGELOG.md --dir apps/admin/changelog.d
          git add -A
          git commit -qm "release: admin-2.0.1"
          head="$(git rev-parse HEAD)"

          # facts → decide for each track on the same merge: the admin track
          # is a ceremony, the default track beside it is ordinary work.
          track_facts() { # track_facts <path> <prefix> <key>
            env MERGE_SHA="$head" EVENT_BEFORE="$base" VERSION_SOURCE=file \
              TRACK_PATH="$1" TAG_PREFIX="$2" bash "$CEREMONY_DIR/lib/facts.sh" \
              | sed -n "s/^$3=//p"
          }
          track_verdict() { # track_verdict <path> <prefix>
            env VER="$(track_facts "$1" "$2" ver)" BASE_VER="$(track_facts "$1" "$2" base_ver)" \
              RELEASED="$(track_facts "$1" "$2" released)" LABELED="$(track_facts "$1" "$2" labeled)" \
              bash "$CEREMONY_DIR/lib/decide.sh" | sed -n 's/^ceremony=//p'
          }
          [ "$(track_facts apps/admin admin- ver)" = 2.0.1 ]
          [ "$(track_facts apps/admin admin- base_ver)" = 2.0.1-dev ]
          [ "$(track_facts apps/admin admin- tag)" = admin-2.0.1 ]
          [ "$(track_verdict apps/admin admin-)" = yes ]
          [ "$(track_facts . "" ver)" = 1.6.0-dev ]
          [ "$(track_verdict . "")" = no ]

          # The admin track's notes, publish and re-arm: release.yml's bodies
          # with the track's environment (the fetch and push left out).
          TRACK_PATH=apps/admin
          TAG_PREFIX=admin-
          VER=2.0.1
          TAG=admin-2.0.1
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/changelog.sh"
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/version.sh"
          # shellcheck source=/dev/null
          . "$CEREMONY_DIR/lib/track.sh"
          changelog="$(track_file "$TRACK_PATH" CHANGELOG.md)"
          changelog_section "$changelog" "$VER" > "$RUNNER_TEMP/notes.md"
          grep -F 'The admin fixed a thing' "$RUNNER_TEMP/notes.md"
          if grep -F 'site change' "$RUNNER_TEMP/notes.md"; then
            echo "the admin's notes carried the site's fragment" >&2
            exit 1
          fi
          git tag "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" -R "$GITHUB_REPOSITORY"
          grep -Fx 'isPrerelease=false' "$EXERCISE_RELEASES/$TAG.meta"
          diff -u "$RUNNER_TEMP/notes.md" "$EXERCISE_RELEASES/$TAG.notes"
          next="$(version_next_dev "$VER")"
          next_name="$(track_tag "$TAG_PREFIX" "$next")"
          version_write file "$next" "$TRACK_PATH"
          git add "$(track_file "$TRACK_PATH" VERSION)"
          git commit -qm "chore: bump main to $next_name — re-arm after publishing $TAG"
          [ "$(cat apps/admin/VERSION)" = 2.0.2-dev ]
          [ "$(cat VERSION)" = 1.6.0-dev ]
          [ "$(git show --format= --name-only HEAD)" = apps/admin/VERSION ]
          git log -1 --format=%s | grep -F 'bump main to admin-2.0.2-dev — re-arm after publishing admin-2.0.1'
          [ -f changelog.d/7.md ]

          # The tag doors: each track releases its own tags and no-ops on the
          # other's, declared through non-release-namespace.
          classify() { env TAG="$1" TAG_PREFIX="$2" NON_RELEASE_NAMESPACE="$3" bash "$CEREMONY_DIR/lib/tag-classify.sh"; }
          [ "$(classify admin-2.0.1 admin- '[0-9]*')" = classification=release ]
          [ "$(classify 1.6.0 admin- '[0-9]*' 2>/dev/null)" = classification=non-release ]
          [ "$(classify admin-2.0.1 '' 'admin-*' 2>/dev/null)" = classification=non-release ]
          [ "$(classify 1.6.0 '' 'admin-*')" = classification=release ]
          echo "admin-2.0.1" > "$RUNNER_TEMP/admin-tag"

          # The other way round: the default track's ceremony on the next
          # merge, with the admin track re-armed beside it.
          base="$(git rev-parse HEAD)"
          printf '1.6.0\n' > VERSION
          bash "$CEREMONY_DIR/bin/changelog-assemble" 1.6.0 2026-09-25
          git add -A
          git commit -qm "release: 1.6.0"
          head="$(git rev-parse HEAD)"
          [ "$(track_verdict . "")" = yes ]
          [ "$(track_facts . "" tag)" = 1.6.0 ]
          [ "$(track_verdict apps/admin admin-)" = no ]
          TRACK_PATH=.
          TAG_PREFIX=
          VER=1.6.0
          TAG=1.6.0
          changelog="$(track_file "$TRACK_PATH" CHANGELOG.md)"
          changelog_section "$changelog" "$VER" > "$RUNNER_TEMP/notes.md"
          grep -F 'A site change still pending' "$RUNNER_TEMP/notes.md"
          git tag "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" -R "$GITHUB_REPOSITORY"
          version_write file "$(version_next_dev "$VER")" "$TRACK_PATH"
          git add "$(track_file "$TRACK_PATH" VERSION)"
          git commit -qm "chore: bump main to $(track_tag "$TAG_PREFIX" "$(version_next_dev "$VER")") — re-arm after publishing $TAG"
          [ "$(cat VERSION)" = 1.6.1-dev ]
          [ "$(cat apps/admin/VERSION)" = 2.0.2-dev ]
          [ "$(git show --format= --name-only HEAD)" = VERSION ]

          # A prefixed release candidate: tag-only, notes from the track's
          # surviving fragments, a prerelease, and the rc re-arm.
          printf -- '- The admin candidate entry (#40).\n' > apps/admin/changelog.d/40.md
          git add -A
          git commit -qm "admin work"
          base="$(git rev-parse HEAD)"
          printf '2.1.0-rc1\n' > apps/admin/VERSION
          git add -A
          git commit -qm "release: admin-2.1.0-rc1"
          head="$(git rev-parse HEAD)"
          [ "$(track_facts apps/admin admin- tag)" = admin-2.1.0-rc1 ]
          [ "$(track_verdict apps/admin admin-)" = yes ]
          TRACK_PATH=apps/admin
          TAG_PREFIX=admin-
          VER=2.1.0-rc1
          TAG=admin-2.1.0-rc1
          changelog="$(track_file "$TRACK_PATH" CHANGELOG.md)"
          bash "$CEREMONY_DIR/bin/changelog-assemble" "$VER" --check \
            --changelog "$changelog" --dir "$(track_file "$TRACK_PATH" changelog.d)" > "$RUNNER_TEMP/notes.md"
          grep -F 'The admin candidate entry' "$RUNNER_TEMP/notes.md"
          [ "$(classify "$TAG" admin- '[0-9]*')" = classification=release ]
          git tag "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" -R "$GITHUB_REPOSITORY" --prerelease
          grep -Fx 'isPrerelease=true' "$EXERCISE_RELEASES/$TAG.meta"
          version_write file "$(version_next_dev "$VER")" "$TRACK_PATH"
          [ "$(cat apps/admin/VERSION)" = 2.1.0-rc2-dev ]
          [ "$(cat VERSION)" = 1.6.1-dev ]
          echo "two-track replay ($CEREMONY_DIR): admin-2.0.1, then 1.6.0, then the prerelease admin-2.1.0-rc1 — each re-armed only its own track"
      - name: write a fixture artifact hook that asserts its inputs and environment
        # A stand-in for a consumer's .github/actions/release-artifact: it
        # fails unless it sees the bare version as input and the track's tag
        # and directory in its environment (#618).
        run: |
          mkdir -p .github/actions/release-artifact
          cat > .github/actions/release-artifact/action.yml <<'EOF'
          name: fixture release artifact
          inputs:
            version:
              required: true
          runs:
            using: composite
            steps:
              - shell: bash
                env:
                  VERSION: @@INPUT_VERSION@@
                run: |
                  [ "$VERSION" = 2.0.1 ] || { echo "version: got '$VERSION'" >&2; exit 1; }
                  [ "$RELEASE_TAG" = admin-2.0.1 ] || { echo "RELEASE_TAG: got '$RELEASE_TAG'" >&2; exit 1; }
                  [ "$RELEASE_TRACK_PATH" = apps/admin ] || { echo "RELEASE_TRACK_PATH: got '$RELEASE_TRACK_PATH'" >&2; exit 1; }
                  echo "hook saw version $VERSION, tag $RELEASE_TAG, track $RELEASE_TRACK_PATH"
          EOF
          # The input expression goes in after the heredoc: written inline,
          # the runner would expand it in THIS step, where it is empty.
          sed -i 's/@@INPUT_VERSION@@/$\{\{ inputs.version \}\}/' .github/actions/release-artifact/action.yml
          grep -F 'inputs.version }}' .github/actions/release-artifact/action.yml
      - name: artifact hook — the consumer's own release-artifact action
        # release.yml's hook step, with the two-track fixture's admin release
        # standing in for the facts step's outputs and the track's env.
        uses: ./.github/actions/release-artifact
        env:
          RELEASE_TAG: admin-2.0.1
          RELEASE_TRACK_PATH: apps/admin
        with:
          version: "2.0.1"

  fixture-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: the merge door's script chain against a fixture ceremony
        run: bash test/release-chain.test.sh
